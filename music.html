<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music - えいこう王国</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
    rel="stylesheet">

  <style>
    /* =========================================
           1. 洗練されたモダン・ミニマルスタイル（ライト）
        ========================================= */
    :root {
      --bg-color: #fafafa;
      /* ほんのり温かみのある白 */
      --text-main: #1e293b;
      /* 濃いスレートグレー */
      --text-muted: #64748b;
      /* 落ち着いたグレー */
      --accent-color: #0f172a;
      /* ほぼ黒のネイビー */
      --border-color: #e2e8f0;
      /* 薄く上品な境界線 */

      /* 音楽のパビリオンを引き立てるアイデンティティカラー */
      --color-muth: #8b5cf6;
      /* 音楽理論: 神秘的なバイオレット */
      --color-best: #d97706;
      /* おすすめ曲: 深みのあるアンバーゴールド */
      --color-dtm: #0ea5e9;
      /* DTM: 澄み渡るライトブルー */
      --color-muther: #10b981;
      /* その他: 瑞々しいエメラルドグリーン */
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Sans JP', 'Helvetica Neue', sans-serif;
      line-height: 1.8;
      letter-spacing: 0.05em;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* --- ヘッダー（4ファイル完全共通・ズレ防止） --- */
    header {
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 40px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      /* 横幅の計算を全ファイルで固定 */
    }

    .logo {
      font-family: 'Jost', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .navigation {
      display: flex;
      gap: 30px;
      /* ボタン同士の間隔を30pxに固定 */
    }

    .navigation-item {
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    .navigation-item:hover {
      color: var(--text-main);
    }

    /* スマホ表示時のズレも完全に防止 */
    @media (max-width: 640px) {
      header {
        padding: 15px 20px;
        /* スマホ時は左右の余白を20pxに統一 */
      }
    }

    /* --- コンテンツエリア --- */
    .page-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px 100px 20px;
    }

    /* ページタイトル */
    .page-title {
      font-size: 32px;
      font-weight: 300;
      text-align: center;
      margin-bottom: 60px;
      letter-spacing: 4px;
    }

    /* =========================================
           2. ブログ風・グリッドレイアウト
        ========================================= */
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 35px;
    }

    /* 高級感のあるミニマルブログカード */
    .subject-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 35px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease;
    }

    /* 上部の細いインライン・カラーアクセント */
    .subject-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }

    .card-muth::before {
      background: var(--color-muth);
    }

    .card-best::before {
      background: var(--color-best);
    }

    .card-dtm::before {
      background: var(--color-dtm);
    }

    .card-muther::before {
      background: var(--color-muther);
    }

    /* タイトルヘッダー */
    .subject-title {
      font-size: 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-main);
      letter-spacing: 1px;
    }

    .subject-title i {
      font-size: 22px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* アイコン固有カラー */
    .card-muth i {
      color: var(--color-muth);
    }

    .card-best i {
      color: var(--color-best);
    }

    .card-dtm i {
      color: var(--color-dtm);
    }

    .card-muther i {
      color: var(--color-muther);
    }

    /* --- ホバーエフェクト --- */
    .subject-card:hover {
      transform: translateY(-5px);
    }

    .subject-card:hover .subject-title i {
      transform: scale(1.15);
    }

    /* 各カードの個別ホバーシャドウと境界線発光 */
    .subject-card.card-muth:hover {
      border-color: rgba(139, 92, 246, 0.3);
      box-shadow: 0 15px 30px rgba(139, 92, 246, 0.05);
    }

    .subject-card.card-best:hover {
      border-color: rgba(217, 119, 6, 0.3);
      box-shadow: 0 15px 30px rgba(217, 119, 6, 0.05);
    }

    .subject-card.card-dtm:hover {
      border-color: rgba(14, 165, 233, 0.3);
      box-shadow: 0 15px 30px rgba(14, 165, 233, 0.05);
    }

    .subject-card.card-muther:hover {
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 0 15px 30px rgba(16, 185, 129, 0.05);
    }

    /* 洗練された下部メインボタン */
    .btn-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--accent-color);
      color: #ffffff;
      border-radius: 8px;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 500;
      margin-top: auto;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .btn-main:hover {
      background-color: #1e293b;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    @media (max-width: 640px) {
      header {
        padding: 15px 20px;
      }

      .subject-grid {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .page-title {
        font-size: 28px;
      }

      .subject-card {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">EIKOU KINGDOM</div>
    <div class="navigation">
      <a href="index.html" class="navigation-item">Top</a>
      <a href="rank.html" class="navigation-item">Ranking</a>
      <a href="search.html" class="navigation-item">Search</a>
    </div>
  </header>

  <div class="page-content">

    <h1 class="page-title">MUSIC</h1>

    <div class="subject-grid">

      <div class="subject-card card-muth">
        <a href="muth.html" class="subject-title">
          <i class="fa-solid fa-book-open"></i> 音楽理論
        </a>
        <a href="muth.html" class="btn-main">記事一覧を見る <i class="fa-solid fa-arrow-right"></i></a>
      </div>

      <div class="subject-card card-best">
        <a href="best.html" class="subject-title">
          <i class="fa-solid fa-headphones"></i> おすすめ曲
        </a>
        <a href="best.html" class="btn-main">記事一覧を見る <i class="fa-solid fa-arrow-right"></i></a>
      </div>

      <div class="subject-card card-dtm">
        <a href="dtm.html" class="subject-title">
          <i class="fa-solid fa-sliders"></i> DTM
        </a>
        <a href="dtm.html" class="btn-main">記事一覧を見る <i class="fa-solid fa-arrow-right"></i></a>
      </div>

      <div class="subject-card card-muther">
        <a href="muther.html" class="subject-title">
          <i class="fa-solid fa-compact-disc"></i> その他
        </a>
        <a href="muther.html" class="btn-main">記事一覧を見る <i class="fa-solid fa-arrow-right"></i></a>
      </div>

    </div>

  </div>
</body>

</html>
