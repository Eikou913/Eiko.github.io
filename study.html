<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study(学問アーカイブ) - えいこう王国</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
    rel="stylesheet">

  <style>
    /* =========================================
           1. 洗練されたモダン・ミニマルスタイル（ライト）
        ========================================= */
    :root {
      --bg-color: #fafafa;
      /* ほんのり温かみのある白 */
      --text-main: #1e293b;
      /* 濃いスレートグレー（真っ黒より知的） */
      --text-muted: #64748b;
      /* 落ち着いたグレー */
      --accent-color: #0f172a;
      /* ほぼ黒のネイビー（引き締め色） */
      --border-color: #e2e8f0;
      /* 薄く上品な境界線 */

      /* カラフルな各科目のアイデンティティカラー */
      --color-japa: #ff477e;
      /* 国語: 鮮やかなピンクレッド */
      --color-math: #0ea5e9;
      /* 数学: 澄み渡るライトブルー */
      --color-eng: #d97706;
      /* 英語: 深みのあるアンバーゴールド */
      --color-sci: #10b981;
      /* 理科: 瑞々しいエメラルドグリーン */
      --color-socia: #f97316;
      /* 社会: エネルギッシュなオレンジ */
      --color-econ: #ec4899;
      /* 経済: ファッショナブルなピンク */
      --color-phi: #8b5cf6;
      /* 哲学: 神秘的なバイオレット */
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Sans JP', 'Helvetica Neue', sans-serif;
      line-height: 1.8;
      letter-spacing: 0.05em;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* --- ヘッダー（4ファイル完全共通・ズレ防止） --- */
    header {
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 40px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      /* 横幅の計算を全ファイルで固定 */
    }

    .logo {
      font-family: 'Jost', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .navigation {
      display: flex;
      gap: 30px;
      /* ボタン同士の間隔を30pxに固定 */
    }

    .navigation-item {
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    .navigation-item:hover {
      color: var(--text-main);
    }

    /* スマホ表示時のズレも完全に防止 */
    @media (max-width: 640px) {
      header {
        padding: 15px 20px;
        /* スマホ時は左右の余白を20pxに統一 */
      }
    }

    /* --- コンテンツエリア --- */
    .page-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px 100px 20px;
    }

    /* ページタイトル */
    .page-title {
      font-size: 32px;
      font-weight: 300;
      text-align: center;
      margin-bottom: 60px;
      letter-spacing: 4px;
    }

    /* =========================================
           2. ブログ風・科目グリッドレイアウト
        ========================================= */
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 35px;
    }

    /* 高級感のあるミニマルブログカード */
    .subject-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 35px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease;
    }

    /* 上部の細いインライン・カラーアクセント */
    .subject-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }

    .japa::before {
      background: var(--color-japa);
    }

    .math::before {
      background: var(--color-math);
    }

    .eng::before {
      background: var(--color-eng);
    }

    .sci::before {
      background: var(--color-sci);
    }

    .socia::before {
      background: var(--color-socia);
    }

    .econ::before {
      background: var(--color-econ);
    }

    .phi::before {
      background: var(--color-phi);
    }

    /* 科目タイトルヘッダー */
    .subject-title {
      font-size: 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-main);
      letter-spacing: 1px;
    }

    .subject-title i {
      font-size: 22px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 各科目のアイコン固有カラー */
    .japa i {
      color: var(--color-japa);
    }

    .math i {
      color: var(--color-math);
    }

    .eng i {
      color: var(--color-eng);
    }

    .sci i {
      color: var(--color-sci);
    }

    .socia i {
      color: var(--color-socia);
    }

    .econ i {
      color: var(--color-econ);
    }

    .phi i {
      color: var(--color-phi);
    }

    /* サブカテゴリのタグリンク */
    .sub-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .sub-link {
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    /* --- ホバーエフェクト（かっこよさとカラフルさの融合） --- */
    .subject-card:hover {
      transform: translateY(-5px);
    }

    .subject-card:hover .subject-title i {
      transform: scale(1.15);
    }

    /* 各科目カードの個別ホバーシャドウと境界線発光 */
    .subject-card.japa:hover {
      border-color: rgba(255, 71, 126, 0.3);
      box-shadow: 0 15px 30px rgba(255, 71, 126, 0.05);
    }

    .subject-card.math:hover {
      border-color: rgba(14, 165, 233, 0.3);
      box-shadow: 0 15px 30px rgba(14, 165, 233, 0.05);
    }

    .subject-card.eng:hover {
      border-color: rgba(217, 119, 6, 0.3);
      box-shadow: 0 15px 30px rgba(217, 119, 6, 0.05);
    }

    .subject-card.sci:hover {
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 0 15px 30px rgba(16, 185, 129, 0.05);
    }

    .subject-card.socia:hover {
      border-color: rgba(249, 115, 22, 0.3);
      box-shadow: 0 15px 30px rgba(249, 115, 22, 0.05);
    }

    .subject-card.econ:hover {
      border-color: rgba(236, 72, 153, 0.3);
      box-shadow: 0 15px 30px rgba(236, 72, 153, 0.05);
    }

    .subject-card.phi:hover {
      border-color: rgba(139, 92, 246, 0.3);
      box-shadow: 0 15px 30px rgba(139, 92, 246, 0.05);
    }

    /* サブタグの個別ホバー挙動 */
    .japa .sub-link:hover {
      color: var(--color-japa);
      background: rgba(255, 71, 126, 0.05);
      border-color: rgba(255, 71, 126, 0.2);
    }

    .math .sub-link:hover {
      color: var(--color-math);
      background: rgba(14, 165, 233, 0.05);
      border-color: rgba(14, 165, 233, 0.2);
    }

    .eng .sub-link:hover {
      color: var(--color-eng);
      background: rgba(217, 119, 6, 0.05);
      border-color: rgba(217, 119, 6, 0.2);
    }

    .sci .sub-link:hover {
      color: var(--color-sci);
      background: rgba(16, 185, 129, 0.05);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .socia .sub-link:hover {
      color: var(--color-socia);
      background: rgba(249, 115, 22, 0.05);
      border-color: rgba(249, 115, 22, 0.2);
    }

    .econ .sub-link:hover {
      color: var(--color-econ);
      background: rgba(236, 72, 153, 0.05);
      border-color: rgba(236, 72, 153, 0.2);
    }

    .phi .sub-link:hover {
      color: var(--color-phi);
      background: rgba(139, 92, 246, 0.05);
      border-color: rgba(139, 92, 246, 0.2);
    }

    /* 知的な印象を与える洗練された下部ボタン */
    .btn-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--accent-color);
      color: #ffffff;
      border-radius: 8px;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 500;
      margin-top: auto;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .btn-main:hover {
      background-color: #1e293b;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    @media (max-width: 640px) {
      header {
        padding: 15px 20px;
      }

      .subject-grid {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .page-title {
        font-size: 28px;
      }

      .subject-card {
        padding: 25px;
      }
    }
  </style>
</head>
