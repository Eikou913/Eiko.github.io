<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Memory City - Eikou Kingdom</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="top-page-screen">
    <div class="portal-container white-glass">
      <h2><i class="fa-solid fa-city"></i> CITY SEARCH</h2>
      <div class="search-box">
        <input type="text" placeholder="キーワードや時代...">
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <button class="portal-btn"><i class="fa-solid fa-qrcode"></i> 別の街へアクセス</button>
    </div>
  </div>

  <div id="my-page-screen">
    
    <div id="notebook-overlay">
      <div class="notebook-cover">
        <h1 class="notebook-title">MEMORIES</h1>
        <p class="notebook-author">EIKOU KINGDOM</p>
        <div class="notebook-tap-guide"><i class="fa-solid fa-fingerprint"></i> TAP TO DIVE</div>
      </div>
    </div>

    <div id="canvas-container"></div>
    
    <div id="crosshair"></div>

    <div id="my-ui-layer">
      
      <div id="cinematic-focus">
        <div id="cinematic-year">START</div>
      </div>

      <div id="walk-controls-guide">
        <div class="guide-text white-glass">
          <span class="pc-only"><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> で歩く / </span>
          <strong>ドラッグ</strong> で見回す
        </div>
        <div class="mobile-walk-btns">
          <button id="btn-walk-fwd" class="white-glass"><i class="fa-solid fa-arrow-up"></i> 前進</button>
          <button id="btn-walk-bwd" class="white-glass"><i class="fa-solid fa-arrow-down"></i> 後退</button>
        </div>
      </div>

    </div>
  </div>

  <nav id="app-nav" class="white-glass">
    <div class="nav-tab active" id="to-top-btn"><i class="fa-solid fa-globe"></i> Hub</div>
    <div class="nav-tab" id="to-my-btn"><i class="fa-solid fa-city"></i> City</div>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
