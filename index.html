<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>えいこう王国</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* --- 全体の基本設定（風さん風の余白と色使い） --- */
    :root {
      --bg-color: #faf9f6;      /* 温かみのあるオフホワイト */
      --text-main: #2c2c2c;     /* 真っ黒ではない上品な墨色 */
      --text-sub: #8c857d;      /* くすんだグレージュ */
      --border-color: #e0dfdc;  /* 薄いグレーの罫線 */
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Jost', 'Noto Serif JP', serif; /* 明朝体をメインに */
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    a:hover {
      opacity: 0.5; /* ホバー時はフワッと薄くするだけ（シンプルに） */
    }

    /* --- ナビゲーション（ヘッダー） --- */
    .margin1 {
      position: sticky;
      top: 0;
      background: rgba(250, 249, 246, 0.9); /* 少し透ける白 */
      backdrop-filter: blur(5px);
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 15px 0;
    }

    .navigation {
      display: flex;
      justify-content: center;
      gap: 40px; /* メニュー同士の隙間を大きく取る */
    }

    .navigation-item {
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* --- ヒーローエリア（「ようこそ！」の文字） --- */
    /* 背景画像(bg.svg)はここに設定すると、トップの看板のように機能します */
    .phrase {
      height: 60vh; /* 画面の60%の高さを使って大胆に */
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('bg.svg'); 
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* 背景画像の上に薄くフィルターをかけて文字を読みやすくする */
    .phrase::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(250, 249, 246, 0.4);
    }

    .Eikou {
      position: relative;
      font-size: 36px;
      font-weight: 300; /* 細字にして洗練させる */
      letter-spacing: 0.2em; /* 文字の間隔を空けてエモく */
      text-align: center;
      line-height: 1.5;
      margin: 0;
      /* 以前の重いドロップシャドウを消し、シンプルに */
    }

    /* --- コンテンツ全体を包む箱 --- */
    .page-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    /* --- 見出しのスタイル --- */
    h1, h3 {
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 24px;
      margin-top: 60px;
    }

    h1::after { /* 見出しの下に控えめな線を引く */
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background-color: var(--text-main);
      margin: 15px auto 0;
    }

    /* --- プロフィールテキスト --- */
    .Profile p {
      text-align: center;
      color: var(--text-main);
      font-size: 15px;
    }

    .Profile a {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-sub);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* --- メニューグリッド --- */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* スマホでは自動で縦並びに */
      gap: 20px;
      margin: 40px 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80px;
      font-size: 14px;
      letter-spacing: 0.1em;
      border: 1px solid var(--border-color); /* 枠線だけにする */
      background-color: transparent;
      color: var(--text-main);
      transition: all 0.4s ease;
    }

    .menu-item:hover {
      background-color: var(--text-main);
      color: var(--bg-color);
      /* 上に浮くアクションは消し、色だけが反転する大人っぽい動きに */
    }

    /* --- YouTubeエリア --- */
    .media-section {
      margin-top: 100px;
    }

    .youtube-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9の比率を維持 */
      margin-bottom: 40px;
    }

    .youtube-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* --- SNSリンク --- */
    .snslink {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 80px;
      padding-top: 40px;
      border-top: 1px solid var(--border-color);
    }

    .snslink a {
      font-size: 24px; /* アイコンを少し大きめに */
      color: var(--text-sub); /* 普段は薄いグレー */
      transition: color 0.3s;
    }

    .snslink a:hover {
      color: var(--text-main); /* 触ると黒になる */
    }
  </style>
</head>
