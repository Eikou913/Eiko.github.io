<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>えいこう王国</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    /* --- 遊園地風のカラフルなカラーパレット --- */
    :root {
      --bg-color: #fff4d2;      /* カスタードのような背景色 */
      --text-main: #2b2b2b;     /* くっきりした文字色 */
      --color-red: #ff5e5e;     /* ポップな赤 */
      --color-blue: #4db8ff;    /* 空色 */
      --color-yellow: #ffcf33;  /* 元気な黄色 */
      --color-green: #3ade82;   /* メロンソーダ緑 */
      --color-purple: #b37bf0;  /* ゆめかわ紫 */
      --color-pink: #ff85c6;    /* ピンク */
      --border-thick: 4px solid #2b2b2b; /* アメコミ風の太い黒フチ */
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      /* 遊園地っぽいドット柄の背景 */
      background-image: radial-gradient(#ffe082 15%, transparent 20%), radial-gradient(#ffe082 15%, transparent 20%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: var(--text-main);
      font-family: 'M PLUS Rounded 1c', sans-serif;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* --- ナビゲーション（ヘッダー） --- */
    .margin1 {
      background-color: var(--color-blue);
      border-bottom: var(--border-thick);
      padding: 15px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navigation {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .navigation-item {
      background-color: #fff;
      border: var(--border-thick);
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 900;
      color: var(--text-main);
      box-shadow: 3px 3px 0px #2b2b2b;
      transition: all 0.1s ease;
    }

    .navigation-item:active {
      transform: translate(3px, 3px);
      box-shadow: 0px 0px 0px #2b2b2b; /* 押すと凹むアクション */
    }

    /* --- コンテンツ全体を包む箱 --- */
    .page-content {
      max-width: 600px; /* 少し大きめに確保 */
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* --- ヒーローエリア（看板） --- */
    .phrase {
      background-color: var(--color-red);
      border: var(--border-thick);
      border-radius: 30px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 6px 6px 0px #2b2b2b;
      margin-bottom: 50px;
      position: relative;
      overflow: hidden;
    }

    /* 看板の電飾みたいな点線飾り */
    .phrase::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 3px dashed #fff;
      border-radius: 20px;
      pointer-events: none;
    }

    .Eikou {
      margin: 0;
      font-size: 38px;
      font-weight: 900;
      color: #fff;
      text-shadow: 3px 3px 0px var(--text-main); /* 立体的な文字 */
      line-height: 1.4;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }

    /* --- 見出しのスタイル --- */
    h1, h3 {
      text-align: center;
      font-weight: 900;
      background-color: #fff;
      display: inline-block;
      padding: 5px 20px;
      border: var(--border-thick);
      border-radius: 20px;
      box-shadow: 3px 3px 0px #2b2b2b;
      margin-bottom: 20px;
      transform: rotate(-2deg); /* 少し傾けてポップに */
    }

    .section-title-wrap {
      text-align: center;
      margin-top: 50px;
    }

    /* --- プロフィール --- */
    .Profile-box {
      background-color: #fff;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 6px 6px 0px #2b2b2b;
      margin-bottom: 50px;
    }

    .Profile-box p {
      font-weight: 700;
      text-align: center;
    }

    .Profile-box a {
      display: block;
      text-align: center;
      color: var(--color-blue);
      font-weight: 900;
      text-decoration: underline;
      text-underline-offset: 4px;
      margin-top: 15px;
    }

    /* --- ★ここが新しいメニューグリッド（3列構成） --- */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 均等に3列 */
      gap: 15px;
      margin-top: 20px;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 90px;
      border: var(--border-thick);
      border-radius: 15px;
      font-weight: 900;
      font-size: 14px;
      color: var(--text-main);
      background-color: #fff;
      box-shadow: 4px 4px 0px #2b2b2b; /* 厚みのある影 */
      transition: all 0.1s ease;
    }

    .menu-item i {
      font-size: 24px; /* アイコンを大きく */
    }

    /* 押した時のアクション（凹む） */
    .menu-item:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #2b2b2b;
    }

    /* ★ 特別なNekoaマス（一番上で横3マス分使う） */
    .nekoa-special {
      grid-column: span 3; /* 3列分ぶち抜く命令 */
      height: 100px;
      font-size: 20px;
      background-color: var(--color-yellow);
      flex-direction: row; /* アイコンと文字を横並びに */
      gap: 15px;
    }
    .nekoa-special i { font-size: 32px; color: #fff; text-shadow: 2px 2px 0px var(--text-main); }

    /* 各マスの色分け */
    .item-timeline { background-color: var(--color-pink); }
    .item-others { background-color: var(--color-green); }
    .item-life { background-color: var(--color-blue); }
    .item-study { background-color: var(--color-purple); color: #fff;}
    .item-daily { background-color: #ffa447; }
    .item-music { background-color: #fff; }

    /* --- YouTubeエリア --- */
    .youtube-wrapper {
      border: var(--border-thick);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 6px 6px 0px #2b2b2b;
      position: relative;
      width: 100%;
      padding-top: 56.25%;
    }
    .youtube-wrapper iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    /* --- SNSリンク --- */
    .snslink {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 60px;
    }

    .snslink a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background-color: #fff;
      border: var(--border-thick);
      border-radius: 50%;
      font-size: 30px;
      color: var(--text-main);
      box-shadow: 4px 4px 0px #2b2b2b;
      transition: all 0.1s ease;
    }

    .snslink a:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #2b2b2b;
    }

    /* モバイル向け微調整 */
    @media (max-width: 480px) {
      .menu-grid { gap: 10px; }
      .menu-item { font-size: 11px; height: 80px; }
      .menu-item i { font-size: 20px; }
      .nekoa-special { font-size: 16px; height: 80px; }
    }
  </style>
</head>
