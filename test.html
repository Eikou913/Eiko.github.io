<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>記憶の回廊 — StreetView風ギャラリー (Single File)</title>
<style>
  :root{
    --bg:#f2efe8;
    --arch-bg:#efe3cf;
    --glass: rgba(255,251,240,0.95);
    --accent:#d97757;
    --muted:#8c7851;
    --note1:#ffeaa7;
    --note2:#fab1a0;
    --note3:#81ecec;
    --shadow: rgba(0,0,0,0.12);
    --max-width:1200px;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:linear-gradient(180deg,#f7f4ee 0%, #efe9df 100%); color:#2f2a25; -webkit-font-smoothing:antialiased;}

  /* Layout */
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px;}
  header{width:100%;max-width:var(--max-width);margin-bottom:18px;text-align:center}
  header h1{margin:0;font-weight:700;letter-spacing:0.08em}
  header p{margin:6px 0 0;color:var(--muted)}

  /* Navigation pills */
  .nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:var(--glass);padding:6px;border-radius:28px;border:1px solid rgba(140,120,80,0.12);box-shadow:0 6px 18px var(--shadow);z-index:1200}
  .nav .tab{padding:8px 18px;border-radius:20px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
  .nav .tab.active{background:rgba(217,119,87,0.08);color:var(--accent)}

  /* Main arch container (the "portal") */
  .portal{width:100%;max-width:var(--max-width);position:relative;border-radius:36px;padding:28px;background:linear-gradient(145deg,var(--arch-bg),#e6d7bf);box-shadow:0 30px 60px rgba(0,0,0,0.12);overflow:hidden}
  .portal::before{content:"";position:absolute;inset:12px;border-radius:28px;background:radial-gradient(circle at top,#fffaf2 0%, #efe3cf 45%, transparent 100%);pointer-events:none;z-index:0}

  /* corridor stage: wide horizontal strip that can be panned like street-view */
  .corridor-stage{position:relative;z-index:1;display:flex;gap:28px;align-items:stretch;overflow:hidden;padding:18px;border-radius:18px}
  .corridor-track{display:flex;gap:28px;transition:transform 520ms cubic-bezier(.2,.9,.25,1);will-change:transform;padding-bottom:28px}

  /* each arch panel (repeating) */
  .arch-panel{min-width:760px;max-width:760px;background:linear-gradient(180deg,#fffdf7 0%, #f6efe2 100%);border-radius:18px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,0.08);border:1px solid rgba(0,0,0,0.04);display:flex;gap:18px}
  .arch-left{flex:1;display:flex;flex-direction:column;gap:12px}
  .arch-right{width:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}

  /* notes wall (grid) */
  .notes-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.02));border-radius:10px;min-height:220px}
  .note{
    padding:10px 12px;border-radius:8px;font-size:13px;color:#2b2b2b;cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,0.08), inset 0 0 0 1px rgba(255,255,255,0.6);
    transform:rotate(-2deg);transition:transform 160ms ease, box-shadow 160ms ease;
    user-select:none;
  }
  .note:nth-child(3n){background:var(--note2)}
  .note:nth-child(3n+1){background:var(--note1)}
  .note:nth-child(3n+2){background:var(--note3)}
  .note:hover{transform:translateY(-6px) rotate(0deg);box-shadow:0 18px 36px rgba(0,0,0,0.14)}

  /* bench / focal area */
  .bench-area{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
  .bench{width:80%;height:44px;border-radius:10px;background:linear-gradient(90deg,#c9b39a,#b89f84);box-shadow:0 12px 30px rgba(0,0,0,0.18);position:relative}
  .bench::before,.bench::after{content:"";position:absolute;width:12px;height:28px;background:#8d6e4f;border-radius:4px;bottom:-28px}
  .bench::before{left:14%}.bench::after{right:14%}
  .bench-caption{font-size:13px;color:var(--muted);text-align:center}

  /* timeline / street navigator */
  .timeline{position:relative;margin-top:18px;background:transparent;padding:12px 6px;display:flex;align-items:center;gap:12px;justify-content:center}
  .timeline input[type="range"]{width:60%;accent-color:var(--accent)}
  .timeline .coords{font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:center}

  /* floating controls */
  .float-btn{position:fixed;top:20px;width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid rgba(0,0,0,0.06);box-shadow:0 8px 18px rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1300}
  .float-btn.left{left:18px}.float-btn.right{right:18px}

  /* side panels */
  .side-panel{position:fixed;top:0;height:100vh;width:320px;background:#fff;padding:22px;box-shadow:0 30px 60px rgba(0,0,0,0.18);transform:translateX(-110%);transition:transform 420ms cubic-bezier(.2,.9,.25,1);z-index:1400;overflow:auto}
  .side-panel.open{transform:translateX(0)}
  .side-panel.right{right:0;left:auto;transform:translateX(110%)}
  .side-panel h3{margin:0 0 12px;color:var(--accent);font-family:Montserrat, sans-serif;letter-spacing:1px}

  /* sticky note popup */
  .sticky-popup{position:fixed;display:none;z-index:2000;background:#fffdf0;padding:16px;border-radius:10px;box-shadow:8px 20px 40px rgba(0,0,0,0.28);width:300px;border-top:8px solid var(--accent)}
  .sticky-popup h4{margin:0 0 8px}
  .sticky-popup p{margin:0;color:#333;font-size:14px;line-height:1.5}
  .sticky-popup .close{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--muted)}

  /* small helpers */
  .muted{color:var(--muted);font-size:13px}
  .controls-row{display:flex;gap:8px;align-items:center}
  .btn{padding:8px 12px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);background:rgba(217,119,87,0.06);color:var(--accent);cursor:pointer;font-weight:600}

  /* responsive */
  @media (max-width:980px){
    .arch-panel{min-width:640px;max-width:640px}
    .notes-wall{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:720px){
    .portal{padding:16px;border-radius:20px}
    .arch-panel{min-width:92vw;max-width:92vw;flex-direction:column}
    .arch-right{width:100%}
    .notes-wall{grid-template-columns:repeat(2,1fr)}
    .timeline input[type="range"]{width:70%}
  }
</style>
</head>
<body>
  <div class="nav" role="navigation" aria-label="top navigation">
    <div class="tab active" data-target="top">Hub</div>
    <div class="tab" data-target="corridor">Corridor</div>
  </div>

  <div class="wrap">
    <header>
      <h1>記憶の回廊</h1>
      <p>アーチを渡り歩くように、付箋で綴る人生の展示を巡る</p>
    </header>

    <main class="portal" id="portal">
      <div class="corridor-stage" aria-hidden="false">
        <div class="corridor-track" id="track">
          <!-- Repeatable arch panels (simulate street-view frames) -->
          <section class="arch-panel" data-index="0">
            <div class="arch-left">
              <div class="muted">Wall of Notes</div>
              <div class="notes-wall" id="wall-0">
                <div class="note" data-title="幼少期" data-text="初めて自転車に乗れた日。">幼少期</div>
                <div class="note" data-title="音楽" data-text="ピアノを始めたきっかけ。">音楽</div>
                <div class="note" data-title="友人" data-text="深夜まで語り合ったあの夜。">友人</div>
                <div class="note" data-title="挫折" data-text="うまくいかなかったけど、今の糧。">挫折</div>
                <div class="note" data-title="旅" data-text="知らない街で見た朝焼け。">旅</div>
                <div class="note" data-title="現在" data-text="今ここで、次の一歩を考えている。">現在</div>
              </div>
            </div>
            <aside class="arch-right">
              <div class="bench-area">
                <div class="bench" aria-hidden="true"></div>
                <div class="bench-caption">ここに座って、付箋を眺める</div>
              </div>
              <div class="controls-row" style="margin-top:8px">
                <button class="btn" id="open-left">Add Note</button>
                <button class="btn" id="open-right">Ranking</button>
              </div>
            </aside>
          </section>

          <section class="arch-panel" data-index="1">
            <div class="arch-left">
              <div class="muted">Wall of Notes</div>
              <div class="notes-wall" id="wall-1">
                <div class="note" data-title="初恋" data-text="初めて手を繋いだ日。">初恋</div>
                <div class="note" data-title="卒業" data-text="あの教室の匂い。">卒業</div>
                <div class="note" data-title="転機" data-text="決断したあの日の景色。">転機</div>
                <div class="note" data-title="仕事" data-text="初めて任されたプロジェクト。">仕事</div>
                <div class="note" data-title="家族" data-text="帰る場所の温度。">家族</div>
                <div class="note" data-title="夢" data-text="まだ見ぬ未来へのメモ。">夢</div>
              </div>
            </div>
            <aside class="arch-right">
              <div class="bench-area">
                <div class="bench" aria-hidden="true"></div>
                <div class="bench-caption">回廊の奥へ進むほど、時間は遠くなる</div>
              </div>
            </aside>
          </section>

          <section class="arch-panel" data-index="2">
            <div class="arch-left">
              <div class="muted">Wall of Notes</div>
              <div class="notes-wall" id="wall-2">
                <div class="note" data-title="旅路" data-text="列車の窓に映った自分。">旅路</div>
                <div class="note" data-title="別れ" data-text="言葉にできなかった夜。">別れ</div>
                <div class="note" data-title="再会" data-text="変わらぬ笑顔に救われた。">再会</div>
                <div class="note" data-title="挑戦" data-text="怖さを越えた先の景色。">挑戦</div>
                <div class="note" data-title="静寂" data-text="一人で過ごす穏やかな時間。">静寂</div>
                <div class="note" data-title="未来" data-text="まだ書かれていないページ。">未来</div>
              </div>
            </div>
            <aside class="arch-right">
              <div class="bench-area">
                <div class="bench" aria-hidden="true"></div>
                <div class="bench-caption">座って、過去と未来を行き来する</div>
              </div>
            </aside>
          </section>
        </div>
      </div>

      <!-- timeline / street navigator -->
      <div class="timeline" aria-hidden="false">
        <input id="timeline" type="range" min="0" max="200" value="0" />
        <div class="coords muted" style="margin-left:8px">
          <span id="time-label">PAST</span>
        </div>
      </div>
    </main>

    <footer style="margin-top:18px;color:var(--muted);font-size:13px">© 記憶の回廊</footer>
  </div>

  <!-- floating controls -->
  <button class="float-btn left" id="menuBtn" title="Menu">☰</button>
  <button class="float-btn right" id="viewBtn" title="Street View">⤢</button>

  <!-- side panels -->
  <aside class="side-panel" id="leftPanel" aria-hidden="true">
    <span class="close" id="leftClose" style="float:right;cursor:pointer;color:var(--muted)">×</span>
    <h3>付箋を追加</h3>
    <label class="muted">年 / 日付</label>
    <input id="noteDate" type="text" placeholder="2026" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);margin-bottom:10px" />
    <label class="muted">内容</label>
    <textarea id="noteText" rows="4" placeholder="ここに記憶を記述..." style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);"></textarea>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn" id="pasteNote">PASTE NOTE</button>
      <button class="btn" id="closeLeft">CANCEL</button>
    </div>
  </aside>

  <aside class="side-panel right" id="rightPanel" aria-hidden="true">
    <span class="close" id="rightClose" style="float:left;cursor:pointer;color:var(--muted)">×</span>
    <h3>HAPPINESS RANKING</h3>
    <div id="rankingList" style="display:flex;flex-direction:column;gap:8px">
      <div style="background:#fff;padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.04)">2026 — 85% <small class="muted">旅</small></div>
      <div style="background:#fff;padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.04)">2019 — 78% <small class="muted">仕事</small></div>
      <div style="background:#fff;padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.04)">2013 — 92% <small class="muted">家族</small></div>
    </div>
  </aside>

  <!-- sticky popup -->
  <div class="sticky-popup" id="popup" role="dialog" aria-hidden="true">
    <button class="close" id="popupClose">×</button>
    <h4 id="popupTitle">Title</h4>
    <p id="popupText">Text</p>
  </div>

<script>
/* Single-file interactive StreetView-like corridor
   - timeline slider pans the corridor horizontally
   - clicking a note opens a sticky popup
   - side panels toggle for adding notes / ranking
   - new notes are appended to the currently visible wall
*/

(() => {
  const track = document.getElementById('track');
  const timeline = document.getElementById('timeline');
  const popup = document.getElementById('popup');
  const popupTitle = document.getElementById('popupTitle');
  const popupText = document.getElementById('popupText');
  const popupClose = document.getElementById('popupClose');
  const tabs = document.querySelectorAll('.nav .tab');
  const leftPanel = document.getElementById('leftPanel');
  const rightPanel = document.getElementById('rightPanel');
  const menuBtn = document.getElementById('menuBtn');
  const viewBtn = document.getElementById('viewBtn');
  const openLeft = document.getElementById('open-left');
  const openRight = document.getElementById('open-right');
  const leftClose = document.getElementById('leftClose');
  const rightClose = document.getElementById('rightClose');
  const pasteNote = document.getElementById('pasteNote');
  const noteDate = document.getElementById('noteDate');
  const noteText = document.getElementById('noteText');

  // compute track width and pan based on slider
  function updatePan() {
    const maxPan = Math.max(0, track.scrollWidth - track.parentElement.clientWidth);
    const t = timeline.value / (timeline.max || 100);
    const x = -Math.round(maxPan * t);
    track.style.transform = `translateX(${x}px)`;
    // update label
    const label = document.getElementById('time-label');
    label.textContent = t < 0.33 ? 'PAST' : (t < 0.66 ? 'RECENT' : 'FUTURE');
  }

  timeline.addEventListener('input', updatePan);
  window.addEventListener('resize', updatePan);
  updatePan();

  // note click -> popup
  function bindNotes(container) {
    container.querySelectorAll('.note').forEach(n => {
      n.onclick = (e) => {
        const rect = n.getBoundingClientRect();
        popup.style.left = (rect.left + rect.width/2) + 'px';
        popup.style.top = (rect.top - 12) + 'px';
        popupTitle.textContent = n.dataset.title || '記録';
        popupText.textContent = n.dataset.text || n.textContent || '（内容なし）';
        popup.style.display = 'block';
        popup.setAttribute('aria-hidden','false');
      };
    });
  }

  // bind all existing walls
  document.querySelectorAll('.notes-wall').forEach(bindNotes);

  popupClose.addEventListener('click', () => {
    popup.style.display = 'none';
    popup.setAttribute('aria-hidden','true');
  });

  // close popup when clicking outside
  document.addEventListener('click', (e) => {
    if (!popup.contains(e.target) && !e.target.classList.contains('note')) {
      popup.style.display = 'none';
      popup.setAttribute('aria-hidden','true');
    }
  });

  // nav tabs
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      // simple behavior: jump to first panel for Hub, to middle for Corridor
      if (tab.dataset.target === 'top') {
        timeline.value = 0;
      } else {
        timeline.value = 100;
      }
      updatePan();
    });
  });

  // side panels toggles
  function openLeftPanel(){ leftPanel.classList.add('open'); leftPanel.setAttribute('aria-hidden','false'); }
  function closeLeftPanel(){ leftPanel.classList.remove('open'); leftPanel.setAttribute('aria-hidden','true'); }
  function openRightPanel(){ rightPanel.classList.add('open'); rightPanel.setAttribute('aria-hidden','false'); }
  function closeRightPanel(){ rightPanel.classList.remove('open'); rightPanel.setAttribute('aria-hidden','true'); }

  menuBtn.addEventListener('click', () => openLeftPanel());
  viewBtn.addEventListener('click', () => {
    // quick "street view" jump: animate to center panel
    timeline.value = 100;
    updatePan();
  });

  openLeft.addEventListener('click', openLeftPanel);
  openRight.addEventListener('click', openRightPanel);
  leftClose.addEventListener('click', closeLeftPanel);
  rightClose.addEventListener('click', closeRightPanel);

  // paste note: append to currently visible wall
  pasteNote.addEventListener('click', () => {
    const text = (noteText.value || '').trim();
    if (!text) return alert('付箋の内容を入力してください。');
    // determine visible panel by checking track transform
    const trackRect = track.getBoundingClientRect();
    const panels = Array.from(track.querySelectorAll('.arch-panel'));
    // find panel whose center is closest to viewport center
    const viewportCenter = window.innerWidth / 2;
    let best = panels[0], bestDist = Infinity;
    panels.forEach(p => {
      const r = p.getBoundingClientRect();
      const center = r.left + r.width/2;
      const d = Math.abs(center - viewportCenter);
      if (d < bestDist){ bestDist = d; best = p; }
    });
    const wall = best.querySelector('.notes-wall');
    const newNote = document.createElement('div');
    newNote.className = 'note';
    newNote.dataset.title = noteDate.value || '記録';
    newNote.dataset.text = text;
    newNote.textContent = noteDate.value ? `${noteDate.value} — ${text.slice(0,18)}` : text.slice(0,18);
    wall.appendChild(newNote);
    bindNotes(wall);
    noteText.value = '';
    noteDate.value = '';
    closeLeftPanel();
  });

  // keyboard: left/right to nudge timeline
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft'){ timeline.value = Math.max(0, +timeline.value - 6); updatePan(); }
    if (e.key === 'ArrowRight'){ timeline.value = Math.min(+timeline.max, +timeline.value + 6); updatePan(); }
    if (e.key === 'Escape'){ popup.style.display='none'; closeLeftPanel(); closeRightPanel(); }
  });

  // small UX: hide panels on outside click
  document.addEventListener('click', (e) => {
    if (!leftPanel.contains(e.target) && !menuBtn.contains(e.target) && !openLeft.contains(e.target)) closeLeftPanel();
    if (!rightPanel.contains(e.target) && !viewBtn.contains(e.target) && !openRight.contains(e.target)) closeRightPanel();
  });

  // initial bind for dynamic content
  updatePan();
})();
</script>
</body>
</html>
