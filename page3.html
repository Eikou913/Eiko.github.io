<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Life Timeline - Creator Matrix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="title-ui">3D TIMELINE BUILDER</div>

  <div id="control-panel">
    <h2><i class="fa-solid fa-compass-drafting"></i> TIMELINE SCALE</h2>
    <div class="input-group">
      <label>📏 数直線の1マス（グリッド）の単位</label>
      <select id="timeline-scale">
        <option value="day" selected>1日 = 1マス (詳細日記モード)</option>
        <option value="week">1週間 = 1マス (週刊ライフログ)</option>
        <option value="month">1ヶ月 = 1マス (長期年表モード)</option>
      </select>
    </div>

    <div class="section-divider"></div>
    <h2><i class="fa-solid fa-satellite-dish"></i> LOG MATRIX</h2>
    
    <div class="input-group">
      <label>📅 日付</label>
      <input type="text" id="input-date" value="2026.06.02" placeholder="例: 2026.06.02">
    </div>

    <div class="input-group">
      <label>📊 満足度 (X軸: 0 〜 100%)</label>
      <input type="range" id="input-sat" min="0" max="100" value="80">
      <span id="sat-val">80%</span>
    </div>

    <div class="input-group">
      <label>⚡ 一日の密度 (Y軸: 1 〜 3)</label>
      <select id="input-density">
        <option value="1">1 (日常・薄め)</option>
        <option value="2" selected>2 (充実・中面)</option>
        <option value="3">3 (限界突破・濃密)</option>
      </select>
    </div>

    <div class="input-group">
      <label>🎨 カラーシステムモード</label>
      <select id="color-mode">
        <option value="auto" selected>満足度連動 (自動カラー)</option>
        <option value="white">ホワイト統一 (ミニマル)</option>
        <option value="manual">カスタム手動 (個別カラー指定)</option>
      </select>
    </div>

    <div class="input-group" id="picker-group" style="display: none;">
      <label>🖌️ プロットカラー選択</label>
      <input type="color" id="input-picker-color" value="#00d2ff">
    </div>

    <div class="input-group">
      <label>📝 出来事メモ</label>
      <textarea id="input-event" rows="2" placeholder="今日起きた出来事や感情を記録..."></textarea>
    </div>

    <button id="add-btn" class="matrix-btn"><i class="fa-solid fa-plus"></i> 3D空間にプロット</button>

    <div class="section-divider"></div>
    <h2><i class="fa-solid fa-terminal"></i> TELEPORT CONSOLE</h2>
    <div class="input-group">
      <label>⌨️ TPコマンド入力</label>
      <input type="text" id="tp-command-input" placeholder="例: /tp 2026.06.02" style="font-family: 'Share Tech Mono', monospace;">
    </div>
    <div id="tp-status-msg"></div>
  </div>

  <div id="timeline-scrollbar-container">
    <div class="scrollbar-label"><i class="fa-solid fa-timeline"></i> TIMELINE NAVIGATOR (Z-AXIS)</div>
    <input type="range" id="timeline-slider" min="-300" max="300" value="0">
    <div class="scrollbar-coords">
      <span id="coord-past">PAST</span>
      <span id="coord-current">CURRENT CAMERA Z: <span id="cam-z-val">0.0</span></span>
      <span id="coord-future">FUTURE</span>
    </div>
  </div>

  <div id="guide-ui">記録を入力すると、その期間の分だけ3D数直線が自動で生成されて伸びていきます。</div>

  <div id="canvas-container"></div>

  <div id="sticky-note">
    <span class="close-btn" onclick="closeNote()">&times;</span>
    <h3 id="note-title">日付</h3>
    <div class="log-events-container" id="note-events"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <script src="app.js"></script>
</body>
</html>
