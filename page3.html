<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Princess Timeline</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="title-ui">🌸 3D LIFE TRACKER 🌸</div>

  <button id="menu-toggle-btn">
    <i class="fa-solid fa-ribbon"></i>
  </button>

  <div id="control-panel">
    <span id="panel-close-btn">&times;</span>

    <h2><i class="fa-solid fa-sliders"></i> TIMELINE SCALE</h2>
    <div class="input-group">
      <label>📏 タイムラインの表示単位</label>
      <select id="timeline-scale">
        <option value="day" selected>🎀 1日 = 1マス (まいにち日記)</option>
        <option value="week">🌸 1週間 = 1マス (しゅうかんログ)</option>
        <option value="month">🦄 1ヶ月 = 1マス (おもいで年表)</option>
      </select>
    </div>

    <div class="section-divider"></div>
    <h2><i class="fa-solid fa-heart"></i>🌸 DIARY LOG</h2>
    
    <div class="input-group">
      <label>📅 日付</label>
      <input type="text" id="input-date" value="2026.06.02" placeholder="例: 2026.06.02">
    </div>

    <div class="input-group">
      <label>📊 きょうの満足度 (0 〜 100%)</label>
      <input type="range" id="input-sat" min="0" max="100" value="80">
      <span id="sat-val">80%</span>
    </div>

    <div class="input-group">
      <label>⚡ いちにちの密度 (1 〜 3)</label>
      <select id="input-density">
        <option value="1">🧸 1 (まったり日常)</option>
        <option value="2" selected>✨ 2 (はっぴー充実)</option>
        <option value="3">🚀 3 (限界突破イベント)</option>
      </select>
    </div>

    <div class="input-group">
      <label>🎨 カラーモード</label>
      <select id="color-mode">
        <option value="auto" selected>ココロ連動 (パステル自動)</option>
        <option value="white">ミルキーホワイト (一括)</option>
        <option value="manual">お気に入りカラー (手動指定)</option>
      </select>
    </div>

    <div class="input-group" id="picker-group" style="display: none;">
      <label>🖌️ カラーセレクト</label>
      <input type="color" id="input-picker-color" value="#ff758f">
    </div>

    <div class="input-group">
      <label>📝 もよおし・おもいでメモ</label>
      <textarea id="input-event" rows="2" placeholder="今日あった素敵なできごと、感情をメモ..."></textarea>
    </div>

    <button id="add-btn" class="matrix-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> 3D空間にプロット</button>

    <div class="section-divider"></div>
    <h2><i class="fa-solid fa-wand-magic"></i> ✨ MAGIC TP</h2>
    <div class="input-group">
      <label>⌨️ ワープコマンド入力</label>
      <input type="text" id="tp-command-input" placeholder="例: /tp 2026.06.02" style="font-family: 'Share Tech Mono', monospace;">
    </div>
    <div id="tp-status-msg"></div>
  </div>

  <div id="timeline-scrollbar-container">
    <div class="scrollbar-label"><i class="fa-solid fa-wand-magic-sparkles"></i> TIMELINE NAVIGATOR</div>
    <input type="range" id="timeline-slider" min="-300" max="300" value="0">
    <div class="scrollbar-coords">
      <span id="coord-past">PAST</span>
      <span id="coord-current">Z: <span id="cam-z-val">0.0</span></span>
      <span id="coord-future">FUTURE</span>
    </div>
  </div>

  <div id="guide-ui">左上の 🎀 から日記パネルを展開。下のバーで時間軸をスライドできます。</div>

  <div id="canvas-container"></div>

  <div id="sticky-note">
    <span class="close-btn" onclick="closeNote()">&times;</span>
    <h3 id="note-title">日付</h3>
    <div class="log-events-container" id="note-events"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <script src="app.js"></script>
</body>
</html>
