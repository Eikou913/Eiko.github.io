<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Life Timeline - Matrix Control</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="title-ui">3D TIMELINE MATRIX</div>

  <div id="control-panel">
    <h2><i class="fa-solid fa-pen-to-square"></i> LOG MATRIX</h2>
    
    <div class="input-group">
      <label>📅 日付</label>
      <input type="text" id="input-date" value="2026.06.02" placeholder="例: 2026.06.02">
    </div>

    <div class="input-group">
      <label>📊 満足度 (X軸: 0 〜 100%)</label>
      <input type="range" id="input-sat" min="0" max="100" value="80">
      <span id="sat-val">80%</span>
    </div>

    <div class="input-group">
      <label>⚡ 一日の密度 (Y軸: 1 〜 3)</label>
      <select id="input-density">
        <option value="1">1 (日常・薄め)</option>
        <option value="2" selected>2 (充実・中面)</option>
        <option value="3">3 (限界突破・濃密)</option>
      </select>
    </div>

    <div class="input-group">
      <label>📝 出来事メモ</label>
      <textarea id="input-event" rows="3" placeholder="今日起きた出来事や感情を記録..."></textarea>
    </div>

    <button id="add-btn"><i class="fa-solid fa-plus"></i> 3D空間にプロット</button>
  </div>

  <div id="guide-ui">Z軸上のポイントをタップすると、その日のY軸（密度）が立ち上がります。ドラッグで3D回転。</div>

  <div id="canvas-container"></div>

  <div id="sticky-note">
    <span class="close-btn" onclick="closeNote()">&times;</span>
    <h3 id="note-title">日付</h3>
    <div class="log-events-container" id="note-events"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <script src="app.js"></script>
</body>
</html>
