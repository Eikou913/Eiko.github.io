<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生計画 - えいこう王国</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================
           1. 洗練されたモダン・ミニマルスタイル
        ========================================= */
        :root {
            --bg-color: #fafafa;
            /* ほんのり温かみのある白 */
            --text-main: #1e293b;
            /* 濃いスレートグレー（真っ黒より知的） */
            --text-muted: #64748b;
            /* 落ち着いたグレー */
            --accent-color: #0f172a;
            /* ほぼ黒のネイビー（引き締め色） */
            --border-color: #e2e8f0;
            /* 薄く上品な境界線 */
            --highlight: #38bdf8;
            /* 知的な印象を与えるクリアなブルー */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans JP', 'Helvetica Neue', sans-serif;
            line-height: 1.8;
            letter-spacing: 0.05em;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- ヘッダー（4ファイル完全共通・ズレ防止） --- */
        header {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            /* 横幅の計算を全ファイルで固定 */
        }

        .logo {
            font-family: 'Jost', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        .navigation {
            display: flex;
            gap: 30px;
            /* ボタン同士の間隔を30pxに固定 */
        }

        .navigation-item {
            font-family: 'Jost', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .navigation-item:hover {
            color: var(--text-main);
        }

        /* スマホ表示時のズレも完全に防止 */
        @media (max-width: 640px) {
            header {
                padding: 15px 20px;
                /* スマホ時は左右の余白を20pxに統一 */
            }
        }

        /* --- コンテンツエリア --- */
        .page-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px 100px 20px;
        }

        /* ページタイトル */
        .page-title {
            font-size: 32px;
            font-weight: 300;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 4px;
        }

        /* --- 人生計画 サブナビゲーション（クリーンなタブ風） --- */
        .vision-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 60px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .vision-nav-item {
            padding: 8px 16px;
            font-size: 14px;
            color: var(--text-muted);
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .vision-nav-item:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .vision-nav-item.active {
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: 500;
        }

        /* --- テキストコンテンツ --- */
        .document-section {
            margin-bottom: 60px;
        }

        h2 {
            font-size: 20px;
            font-weight: 500;
            border-left: 3px solid var(--accent-color);
            padding-left: 15px;
            margin: 50px 0 20px 0;
        }

        p {
            font-size: 15px;
            color: #334155;
            margin-bottom: 20px;
        }

        /* CPU/GPU/RAM の解説（アカデミックな注釈風） */
        .concept-box {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .concept-item {
            margin-bottom: 20px;
        }

        .concept-item:last-child {
            margin-bottom: 0;
        }

        .concept-item strong {
            font-family: 'Jost', sans-serif;
            color: var(--highlight);
            font-size: 16px;
            display: block;
            margin-bottom: 5px;
        }

        .concept-item span {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* 比較リスト（すっきりとした箇条書き） */
        .comparison-list {
            background-color: #f8fafc;
            border-left: 3px solid var(--border-color);
            padding: 20px 30px;
            margin: 20px 0;
            list-style: none;
        }

        .comparison-list li {
            margin-bottom: 10px;
            font-size: 14.5px;
        }

        .comparison-list li:last-child {
            margin-bottom: 0;
        }

        .comparison-list strong {
            color: var(--accent-color);
        }

        /* =========================================
           3. マイルストーン（ロードマップ）
        ========================================= */
        .roadmap-container {
            margin-top: 60px;
        }

        .phase-block {
            margin-bottom: 50px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #ffffff;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .phase-header {
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .phase-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-color);
        }

        .phase-progress {
            font-family: 'Jost', sans-serif;
            font-size: 13px;
            color: var(--highlight);
            font-weight: 500;
        }

        .step-list {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .step-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
        }

        .step-name {
            font-size: 15px;
            font-weight: 500;
        }

        .step-percent {
            font-family: 'Jost', sans-serif;
            font-size: 12px;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 12px;
            color: var(--text-muted);
        }

        /* タスクのリスト */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-item:hover {
            color: var(--text-main);
        }

        .task-item input[type="checkbox"] {
            margin-top: 3px;
            width: 15px;
            height: 15px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .task-item.checked {
            text-decoration: line-through;
            color: #cbd5e1;
        }

        .vision-goal {
            text-align: center;
            padding: 40px;
            background-color: var(--accent-color);
            color: #ffffff;
            border-radius: 12px;
            margin-top: 40px;
            font-weight: 300;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">EIKOU KINGDOM</div>
        <div class="navigation">
            <a href="index.html" class="navigation-item">Top</a>
            <a href="rank.html" class="navigation-item">Ranking</a>
            <a href="search.html" class="navigation-item">Search</a>
        </div>
    </header>

    <div class="page-content">

        <h1 class="page-title">人生計画</h1>

        <div class="vision-nav">
            <a href="vision.html" class="vision-nav-item active">総合</a>
            <a href="vis1.html" class="vision-nav-item">勉強</a>
            <a href="vis2.html" class="vision-nav-item">音楽</a>
            <a href="vis3.html" class="vision-nav-item">ビジネス</a>
            <a href="vis4.html" class="vision-nav-item">アニメ・ドラマ</a>
            <a href="vis5.html" class="vision-nav-item">恋愛</a>
        </div>

        <div class="document-section">
            <p>僕が生涯やりたいことをここに記載しておきます。</p>
            <p>みんな、25歳で脳の処理が切り替わっちゃうんだって。<br>
                25歳までは新しい概念の習得が得意だけど、25歳以降は今までの知識を組み合わせるのが得意になっていくとのこと。<br>
                僕はこれを信じてるから、できる限り若いうちに色んなことを勉強しておこうと思う。</p>
            <p>もし賢くなりたいとお考えなのであれば、僕と一緒に人生のゴールを設けて、そのゴールから逆算して今日の1分1秒も無駄にしないで生きよう。</p>
        </div>
    </div>

    <script>
        function toggleCheck(labelElement, timelineId) {
            // labelタグを使っているので、クリックイベントは自動的に中のチェックボックスに伝わる
            // 状態が変化した後に計算を行うための遅延処理
            setTimeout(() => {
                const checkbox = labelElement.querySelector('input[type="checkbox"]');
                if (checkbox.checked) {
                    labelElement.classList.add('checked');
                } else {
                    labelElement.classList.remove('checked');
                }
                calculateSquareProgress(timelineId);
            }, 10);
        }

        function calculateSquareProgress(timelineId) {
            const timeline = document.getElementById(timelineId);
            const boxes = timeline.querySelectorAll('.task-item');
            const total = boxes.length;
            let checkedCount = 0;

            boxes.forEach(box => {
                if (box.querySelector('input[type="checkbox"]').checked) {
                    checkedCount++;
                }
            });

            const percent = Math.round((checkedCount / total) * 100);
            document.getElementById(`percent-${timelineId}`).innerText = `${percent}%`;

            calculateStageProgress();
        }

        function calculateStageProgress() {
            // STAGE 01
            const stage1Ids = ['sub1', 'sub2'];
            let stage1TotalPercent = 0;
            stage1Ids.forEach(id => {
                stage1TotalPercent += parseInt(document.getElementById(`percent-${id}`).innerText);
            });
            const stage1Result = Math.round(stage1TotalPercent / stage1Ids.length);
            document.getElementById('stage1-progress').innerText = `${stage1Result}%`;

            // STAGE 02
            const stage2Ids = ['sub3', 'sub4'];
            let stage2TotalPercent = 0;
            stage2Ids.forEach(id => {
                stage2TotalPercent += parseInt(document.getElementById(`percent-${id}`).innerText);
            });
            const stage2Result = Math.round(stage2TotalPercent / stage2Ids.length);
            document.getElementById('stage2-progress').innerText = `${stage2Result}%`;

            // 最終ゴール
            const totalStatus = document.getElementById('total-status');
            const finalPercent = Math.round((stage1Result + stage2Result) / 2);
            if (finalPercent === 100) {
                totalStatus.innerText = "VISION ACCOMPLISHED";
                totalStatus.style.backgroundColor = "#38bdf8"; // 達成時は鮮やかなブルーに
            } else {
                totalStatus.innerText = `OVERALL PROGRESS: ${finalPercent}%`;
                totalStatus.style.backgroundColor = "var(--accent-color)";
            }
        }
    </script>

</body>

</html>
